<svg id="thanh-hoa-districts-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1524 1236" width="1524" height="1236">
  <defs>
    <filter id="parchment-halo" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#f3e3c3" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.0" flood-color="#f3e3c3" flood-opacity="0.98"/>
    </filter>
    <filter id="ink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.0" flood-color="#b45309" flood-opacity="0.85"/>
    </filter>
    <filter id="ink-glow-selected" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#991b1b" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2.0" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <style>
      /* Đường ranh giới huyện thành: nét mực sepia mỏng 1px cố định, 100% không fill, không lớp phủ */
      .district-poly {
        fill: transparent;
        stroke: #4a2810;
        stroke-width: 1.05;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.85;
        cursor: pointer;
        pointer-events: visiblePainted;
        transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.2s ease;
      }
      /* Khi hover: nét mực ranh giới sáng lên màu hổ phách ấm, nét dày hơn một chút, TUYỆT ĐỐI KHÔNG FILL MÀU */
      .district-poly:hover {
        stroke: #c2410c;
        stroke-width: 2.2;
        opacity: 1.0;
        filter: url(#ink-glow);
      }
      /* Khi selected: nét mực ranh giới nổi bật màu chu sa đỏ gạch, TUYỆT ĐỐI KHÔNG FILL MÀU */
      .district-poly.is-selected {
        stroke: #991b1b;
        stroke-width: 2.8;
        opacity: 1.0;
        filter: url(#ink-glow-selected);
      }
      .chau-label { font-family: "Times New Roman", Georgia, serif; font-weight: bold; font-size: 16px; fill: #6b2012; letter-spacing: 3px; text-anchor: middle; filter: url(#parchment-halo); opacity: 0.85; pointer-events: none; }
    </style>
  </defs>
  <g id="chau-titles">
    <text class="chau-label" transform="translate(654.4,241.9) rotate(24)">CHÂU THANH HÓA</text>
    <text class="chau-label" transform="translate(1169.6,537.3) rotate(24)">CHÂU ÁI</text>
    <text class="chau-label" transform="translate(1102.4,938.8) rotate(-42)">CHÂU CỬU CHÂN</text>
  </g>
